openapi: 3.0.3
info:
  title: CampusCast Core API Specification
  description: Multi-tenant REST API for university IoT digital signage management.
  version: 1.0.0
servers:
  - url: https://api.campuscast.edu/v1
    description: Production API Server (AWS ap-south-1)
  - url: http://localhost:8080/v1
    description: Local Development Environment

paths:
  /devices:
    get:
      summary: List managed display kiosks
      operationId: listDevices
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: string
            example: org_mit_adt
        - name: status
          in: query
          schema:
            type: string
            enum: [ONLINE, STALE, OFFLINE, MAINTENANCE]
      responses:
        '200':
          description: List of devices matching query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'

  /devices/{deviceId}/commands:
    post:
      summary: Dispatch remote MQTT command to a display kiosk
      operationId: dispatchDeviceCommand
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [FORCE_MANIFEST_SYNC, CLEAR_STORAGE_CACHE, RESTART_KIOSK_APP]
      responses:
        '202':
          description: Command accepted and enqueued for MQTT transmission

  /content/upload-url:
    post:
      summary: Generate S3 Presigned Upload URL for Poster Media
      operationId: generateUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, fileSizeBytes]
              properties:
                fileName:
                  type: string
                contentType:
                  type: string
                  example: image/jpeg
                fileSizeBytes:
                  type: integer
      responses:
        '200':
          description: Presigned upload URL generated for quarantine bucket
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  key:
                    type: string
                  expiresInSeconds:
                    type: integer

  /content/{contentId}/approve:
    post:
      summary: Approve quarantined content poster asset
      operationId: approveContent
      parameters:
        - name: contentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Content approved and marked ready for scheduling

components:
  schemas:
    Device:
      type: object
      properties:
        id:
          type: string
        organizationId:
          type: string
        thingName:
          type: string
        displayName:
          type: string
        status:
          type: string
        currentManifestVersion:
          type: string
        lastHeartbeatAt:
          type: string
