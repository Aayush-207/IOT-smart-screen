<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>CampusCast Mobile Display</title>

<!-- PWA & Mobile Fullscreen Tags -->
<link rel="manifest" href="/manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />

<style>
  :root { color-scheme: dark; }
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
  }
  
  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Full Screen Container - 100% pure poster view */
  #viewport {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #000000;
    overflow: hidden;
  }

  /* Hardware-accelerated Slide Track */
  #slide-track {
    display: flex;
    width: 100%;
    height: 100%;
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }

  .slide-item {
    flex: 0 0 100%;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    overflow: hidden;
  }

  .poster-img {
    width: 100%;
    height: auto;
    max-width: 100vw;
    max-height: 100vh;
    max-height: 100dvh;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    object-position: center;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    display: block;
    margin: auto;
  }

  @media (orientation: landscape) {
    .poster-img {
      width: auto;
      height: 100vh;
      height: 100dvh;
      max-width: 100vw;
      object-fit: contain;
    }
  }

  /* Text-Only Billboard (Only used if an announcement has no poster image or in standby) */
  .text-billboard {
    width: 100%;
    max-width: 100vw;
    aspect-ratio: 16 / 9;
    max-height: 100vh;
    max-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 6vh 6vw;
    background: radial-gradient(circle at 50% 40%, #17191e 0%, #050505 100%);
    box-sizing: border-box;
  }

  .text-billboard .tag {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #34d399;
    margin-bottom: 24px;
  }

  .text-billboard .title {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.15;
    color: #ffffff;
    margin-bottom: 16px;
  }

  .text-billboard .body {
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: #a1a1aa;
    line-height: 1.5;
  }

  /* Force 90deg rotated landscape when phone is in portrait mode */
  body.force-landscape #viewport {
    transform: rotate(90deg);
    transform-origin: center center;
    width: 100dvh;
    height: 100vw;
    position: fixed;
    top: calc(50% - 50vw);
    left: calc(50% - 50dvh);
  }

  /* Invisible touch tap feedback (double-tap for fullscreen) */
  #fs-hint {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.85);
    color: #ffffff;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    padding: 12px 24px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 999;
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="slide-track"></div>
</div>

<div id="fs-hint">Fullscreen Active</div>

<script>
  // PWA Service Worker Registration
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  // Device contract: every poll of this endpoint is the heartbeat, and it resolves
  // targeting, schedule windows, priority and emergency override server-side.
  const API_BASE = 'https://campuscast-smart-screen.netlify.app';

  const slideTrack = document.getElementById('slide-track');
  const fsHint = document.getElementById('fs-hint');

  let posters = [];
  let currentIndex = 0;
  let cycleTimer = null;
  const CYCLE_INTERVAL = 4000; // 4 seconds per poster

  // Fullscreen Handlers
  function toggleFullscreen() {
    const docEl = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(() => {});
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      }
      showHint('Fullscreen Enabled');
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
      showHint('Fullscreen Exited');
    }
  }

  function showHint(text) {
    fsHint.textContent = text;
    fsHint.style.opacity = '1';
    setTimeout(() => { fsHint.style.opacity = '0'; }, 1500);
  }


  // Single tap on mobile to request fullscreen if not already fullscreen
  document.addEventListener('click', () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(() => {});
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      }
    }
  });

  // Double-tap on screen toggles fullscreen
  let lastTap = 0;
  document.addEventListener('touchend', (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 350 && tapLength > 0) {
      toggleFullscreen();
      e.preventDefault();
    }
    lastTap = currentTime;
  });

  // Touch swipe support (left / right)
  let touchStartX = 0;
  let touchEndX = 0;
  document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > 40) {
      if (diff > 0) {
        nextPoster();
      } else {
        prevPoster();
      }
      resetTimer();
    }
  }

  // Parse query params (optional screen id)
  const urlParams = new URLSearchParams(window.location.search);
  const screenId = urlParams.get('id') || '9bf9fb2e-0d18-456a-b20b-a9e5be9e9ecf';

  // Poll this screen's playlist
  async function fetchLivePosters() {
    try {
      const res = await fetch(`${API_BASE}/api/screens/${encodeURIComponent(screenId)}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('Network response not ok');
      const data = await res.json();

      // Pending force-refresh / reboot from the Fleet dashboard (consumed by this poll).
      if (data.force_refresh || data.reboot_requested) {
        window.location.reload();
        return;
      }

      const active = data.playlist || [];

      const oldIds = posters.map(p => p.id).join(',');
      const newIds = active.map(p => p.id).join(',');
      if (oldIds !== newIds) {
        posters = active;
        if (posters.length > 0) {
          buildCarousel();
        } else {
          try { localStorage.removeItem('campuscast_pure_posters'); } catch (_) {}
          buildStandby();
        }
      } else if (posters.length === 0 && !slideTrack.children.length) {
        // First poll came back empty: nothing "changed", but the screen must not stay blank.
        buildStandby();
      }
    } catch (err) {
      if (posters.length === 0) {
        buildStandby();
      }
    }
  }

  function buildStandby() {
    if (cycleTimer) clearInterval(cycleTimer);
    slideTrack.innerHTML = `
      <div class="slide-item">
        <div class="text-billboard">
          <div class="tag">● Standby</div>
          <div class="title" style="font-size: clamp(2rem, 5vw, 3rem);">CampusCast Display</div>
          <div class="body" style="font-size: 14px; color: #a1a1aa; line-height: 1.6;">
            Screen Canvas: <strong style="color: #fff;">1672 &times; 941 px (16:9)</strong><br>
            Awaiting approved posters &bull; Upload via Create Announcement form
          </div>
        </div>
      </div>
    `;
    currentIndex = 0;
    updateTrack(false);
  }

  function esc(value) {
    const el = document.createElement('div');
    el.textContent = value == null ? '' : String(value);
    return el.innerHTML.replace(/"/g, '&quot;');
  }

  function buildCarousel() {
    if (posters.length === 0) {
      buildStandby();
      return;
    }

    try {
      localStorage.setItem('campuscast_pure_posters', JSON.stringify(posters));
    } catch (_) {}

    // For seamless continuous loop, append clone of first item at the end
    const slides = posters.length > 1 ? [...posters, posters[0]] : posters;

    slideTrack.innerHTML = slides.map((p) => {
      if (p.attachment_url) {
        return `
          <div class="slide-item">
            <img 
              src="${esc(p.attachment_url)}" 
              alt="${esc(p.title)}" 
              class="poster-img" 
              loading="eager"
            />
          </div>
        `;
      } else {
        return `
          <div class="slide-item">
            <div class="text-billboard">
              <div class="tag">${esc(p.priority || 'Campus')} Announcement</div>
              <div class="title">${esc(p.title)}</div>
              <div class="body">${esc(p.body)}</div>
            </div>
          </div>
        `;
      }
    }).join('');

    currentIndex = 0;
    updateTrack(false);
    resetTimer();
  }

  function updateTrack(animate = true) {
    if (animate) {
      slideTrack.style.transition = 'transform 750ms cubic-bezier(0.16, 1, 0.3, 1)';
    } else {
      slideTrack.style.transition = 'none';
    }
    slideTrack.style.transform = `translate3d(-${currentIndex * 100}%, 0, 0)`;
  }

  slideTrack.addEventListener('transitionend', () => {
    if (currentIndex === posters.length) {
      currentIndex = 0;
      updateTrack(false);
    }
  });

  function nextPoster() {
    if (posters.length <= 1) return;
    currentIndex++;
    updateTrack(true);
  }

  function prevPoster() {
    if (posters.length <= 1) return;
    if (currentIndex === 0) currentIndex = posters.length;
    currentIndex--;
    updateTrack(true);
  }

  function resetTimer() {
    if (cycleTimer) clearInterval(cycleTimer);
    if (posters.length > 1) {
      cycleTimer = setInterval(nextPoster, CYCLE_INTERVAL);
    }
  }

  fetchLivePosters();
  setInterval(fetchLivePosters, 5000);
</script>
</body>
</html>
