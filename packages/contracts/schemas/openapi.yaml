            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAnalytics"

  /v1/analytics/exports:
    post:
      tags: [Analytics]
      operationId: createAnalyticsExport
      summary: Create an asynchronous CSV export
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalyticsExport"
      responses:
        "202":
          description: Export accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List current user's notifications
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [UNREAD, READ, ARCHIVED]
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"

  /v1/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark an owned notification as read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "204":
          description: Notification marked read
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Get current user's organization notification preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationPreference"
    put:
      tags: [Notifications]
      operationId: replaceNotificationPreferences
      summary: Replace notification preferences atomically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/NotificationPreferenceInput"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationPreference"

  /v1/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: Search append-only audit records
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: actorUserId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"

  /v1/operations/{operationId}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Get the state and result of accepted asynchronous work
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amazon Cognito access token, normally forwarded by the Next.js BFF.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted optimistic version returned by the prior response ETag.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    SessionId:
      $ref: "#/components/parameters/GenericSessionId"
    GenericSessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    CampusId:
      name: campusId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    BuildingId:
      name: buildingId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    LocationId:
      name: locationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ApprovalRequestId:
      name: approvalRequestId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    DeviceGroupId:
      name: deviceGroupId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    ManifestId:
      name: manifestId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }
    OperationId:
      name: operationId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }

  responses:
    Health:
      description: Health state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    Unauthorized:
      description: Authentication is missing, invalid, expired, or revoked
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated principal lacks permission
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource is absent or not visible in the active organization
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State, uniqueness, idempotency, or optimistic-version conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: Semantic or field validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Upload or request exceeds configured bounds
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: Required dependency is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    PageMeta:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string }
        correlationId: { type: string }
        retryable: { type: boolean, default: false }
        errors:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }
    Health:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        service: { type: string }
        version: { type: string }
        timestamp: { $ref: "#/components/schemas/Timestamp" }
        checks: { type: object, additionalProperties: { type: string } }
    OperationAccepted:
      type: object
      required: [operationId, status]
      properties:
        operationId: { $ref: "#/components/schemas/Uuid" }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED] }
        statusUrl: { type: string, format: uri-reference }
    Operation:
      allOf:
        - $ref: "#/components/schemas/OperationAccepted"
        - type: object
          required: [createdAt, updatedAt]
          properties:
            progress:
              type: [number, "null"]
              minimum: 0
              maximum: 1
            result:
              type: [object, "null"]
            error:
              oneOf:
                - $ref: "#/components/schemas/Problem"
                - type: "null"
            createdAt: { $ref: "#/components/schemas/Timestamp" }
            updatedAt: { $ref: "#/components/schemas/Timestamp" }
    Me:
      type: object
      required: [id, email, displayName, organizationId, membershipId, permissions]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email: { type: string, format: email }
        displayName: { type: string }
        phone: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"], format: uri }
        organizationId: { $ref: "#/components/schemas/Uuid" }
        membershipId: { $ref: "#/components/schemas/Uuid" }
        permissions:
          type: array
          items: { type: string }
        roleAssignments:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
    UpdateProfile:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, "null"], maxLength: 32 }
        avatarUrl: { type: [string, "null"], format: uri }
    Session:
      type: object
      required: [id, lastSeenAt, expiresAt, current]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        userAgent: { type: [string, "null"] }
        ipAddress: { type: [string, "null"] }
        lastSeenAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        current: { type: boolean }
    Organization:
      type: object
      required: [id, slug, name, status, defaultTimezone, settings, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        slug: { type: string }
        name: { type: string }
        status: { type: string }
        defaultTimezone: { type: string }
        settings: { type: object }
        version: { type: integer, minimum: 1 }
    UpdateOrganization:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        defaultTimezone: { type: string, minLength: 1, maxLength: 64 }
        settings: { type: object }
    Campus:
      type: object
      required: [id, code, name, timezone, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string }
        name: { type: string }
        timezone: { type: string }
        address: { type: [object, "null"] }
        version: { type: integer, minimum: 1 }
    WriteCampus:
      type: object
      required: [code, name, timezone]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 160 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        address: { type: [object, "null"] }
    Building:
      allOf:
        - $ref: "#/components/schemas/NamedLocation"
        - type: object
          required: [campusId]
          properties:
            campusId: { $ref: "#/components/schemas/Uuid" }
    Zone:
      allOf:
        - $ref: "#/components/schemas/NamedLocation"
        - type: object
          required: [buildingId]
          properties:
            buildingId: { $ref: "#/components/schemas/Uuid" }
            floorLabel: { type: [string, "null"] }
            description: { type: [string, "null"] }
    Location:
      allOf:
        - $ref: "#/components/schemas/NamedLocation"
        - type: object
          required: [zoneId]
          properties:
            zoneId: { $ref: "#/components/schemas/Uuid" }
            description: { type: [string, "null"] }
            orientation: { type: [string, "null"] }
            networkProfile: { type: [object, "null"] }
            installationDetails: { type: [object, "null"] }
    NamedLocation:
      type: object
      required: [id, code, name, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string }
        name: { type: string }
        version: { type: integer, minimum: 1 }
    WriteNamedLocation:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 160 }
    WriteZone:
      allOf:
        - $ref: "#/components/schemas/WriteNamedLocation"
        - type: object
          properties:
            floorLabel: { type: [string, "null"], maxLength: 64 }
            description: { type: [string, "null"], maxLength: 500 }
    WriteLocation:
      allOf:
        - $ref: "#/components/schemas/WriteNamedLocation"
        - type: object
          properties:
            description: { type: [string, "null"], maxLength: 500 }
            orientation: { type: [string, "null"], maxLength: 32 }
            networkProfile: { type: [object, "null"] }
            installationDetails: { type: [object, "null"] }
    OrganizationUser:
      type: object
      required: [userId, membershipId, email, displayName, status, roleAssignments, version]
      properties:
        userId: { $ref: "#/components/schemas/Uuid" }
        membershipId: { $ref: "#/components/schemas/Uuid" }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string }
        roleAssignments:
          type: array
          items: { $ref: "#/components/schemas/RoleAssignment" }
        version: { type: integer, minimum: 1 }
    UserPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OrganizationUser" }
        page: { $ref: "#/components/schemas/PageMeta" }
    InviteUser:
      type: object
      required: [email, roleAssignments]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        displayName: { type: [string, "null"], maxLength: 120 }
        roleAssignments:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/AssignRole" }
    Invitation:
      type: object
      required: [id, email, expiresAt, status]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email: { type: string, format: email }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        status: { type: string, enum: [PENDING, ACCEPTED, EXPIRED, REVOKED] }
    UpdateMembership:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }
    Role:
      type: object
      required: [id, name, permissions, system, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        description: { type: [string, "null"] }
        permissions:
          type: array
          items: { type: string }
        system: { type: boolean }
        version: { type: integer, minimum: 1 }
    WriteRole:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: [string, "null"], maxLength: 500 }
        permissions:
          type: array
          uniqueItems: true
          maxItems: 200
          items: { type: string }
    AssignRole:
      type: object
      required: [roleId, scopeType]
      additionalProperties: false
      properties:
        roleId: { $ref: "#/components/schemas/Uuid" }
        scopeType:
          type: string
          enum: [ORGANIZATION, CAMPUS, BUILDING, ZONE, ORGANIZATIONAL_UNIT]
        scopeId: { type: [string, "null"], format: uuid }
    RoleAssignment:
      allOf:
        - $ref: "#/components/schemas/AssignRole"
        - type: object
          required: [id, roleName]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            roleName: { type: string }
    Category:
      type: object
      required: [id, name, slug, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        slug: { type: string }
        color: { type: [string, "null"] }
        version: { type: integer, minimum: 1 }
    WriteCategory:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        color: { type: [string, "null"], pattern: "^#[0-9A-Fa-f]{6}$" }
    Content:
      type: object
      required: [id, title, status, mediaType, version, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { type: string }
        mediaType: { type: string, enum: [IMAGE, VIDEO] }
        ownerUnitId: { type: [string, "null"], format: uuid }
        categoryId: { type: [string, "null"], format: uuid }
        eventType: { type: [string, "null"] }
        eventStartsAt: { type: [string, "null"], format: date-time }
        eventEndsAt: { type: [string, "null"], format: date-time }
        hardExpiresAt: { type: [string, "null"], format: date-time }
        currentVersionId: { type: [string, "null"], format: uuid }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
    ContentDetail:
      allOf:
        - $ref: "#/components/schemas/Content"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items: { $ref: "#/components/schemas/ContentVersion" }
            activeApproval:
              oneOf:
                - $ref: "#/components/schemas/ApprovalRequest"
                - type: "null"
    ContentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Content" }
        page: { $ref: "#/components/schemas/PageMeta" }
    CreateContent:
      type: object
      required: [title, mediaType]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: [string, "null"], maxLength: 2000 }
        mediaType: { type: string, enum: [IMAGE, VIDEO] }
        ownerUnitId: { type: [string, "null"], format: uuid }
        categoryId: { type: [string, "null"], format: uuid }
        eventType: { type: [string, "null"], maxLength: 80 }
        eventStartsAt: { type: [string, "null"], format: date-time }
        eventEndsAt: { type: [string, "null"], format: date-time }
        hardExpiresAt: { type: [string, "null"], format: date-time }
    UpdateContent:
      allOf:
        - $ref: "#/components/schemas/CreateContent"
      minProperties: 1
    CreateContentVersion:
      type: object
      required: [mediaType]
      additionalProperties: false
      properties:
        mediaType: { type: string, enum: [IMAGE, VIDEO] }
        titleSnapshot: { type: [string, "null"], maxLength: 180 }
        metadataSnapshot: { type: object }
    ContentVersion:
      type: object
      required: [id, versionNumber, mediaType, status, assets, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        versionNumber: { type: integer, minimum: 1 }
        mediaType: { type: string, enum: [IMAGE, VIDEO] }
        status: { type: string }
        validationSummary: { type: [object, "null"] }
        assets:
          type: array
          items: { $ref: "#/components/schemas/MediaAsset" }
        approvedAt: { type: [string, "null"], format: date-time }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    MediaAsset:
      type: object
      required: [id, variant, mediaType, byteLength, sha256, mimeType]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        variant: { type: string }
        mediaType: { type: string, enum: [IMAGE, VIDEO] }
        byteLength: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        mimeType: { type: string }
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
        durationMs: { type: [integer, "null"], minimum: 1 }
        previewUrl: { type: [string, "null"], format: uri }
    CreateUpload:
      type: object
      required: [contentVersionId, fileName, byteLength, mimeType, sha256]
      additionalProperties: false
      properties:
        contentVersionId: { $ref: "#/components/schemas/Uuid" }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        byteLength: { type: integer, minimum: 1 }
        mimeType: { type: string, maxLength: 120 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    UploadAuthorization:
      type: object
      required: [upload, method, url, requiredHeaders, expiresAt]
      properties:
        upload: { $ref: "#/components/schemas/Upload" }
        method: { type: string, const: PUT }
        url: { type: string, format: uri }
        requiredHeaders: { type: object, additionalProperties: { type: string } }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    CompleteUpload:
      type: object
      required: [sha256]
      additionalProperties: false
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    Upload:
      type: object
      required: [id, contentVersionId, status, expiresAt, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        contentVersionId: { $ref: "#/components/schemas/Uuid" }
        status: { type: string }
        failureCode: { type: [string, "null"] }
        failureMessage: { type: [string, "null"] }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    ApprovalRequest:
      type: object
      required: [id, contentVersionId, status, currentStep, submittedAt, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        contentVersionId: { $ref: "#/components/schemas/Uuid" }
        status: { type: string }
        currentStep: { type: integer, minimum: 1 }
        submittedAt: { $ref: "#/components/schemas/Timestamp" }
        resolvedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
    ApprovalRequestDetail:
      allOf:
        - $ref: "#/components/schemas/ApprovalRequest"
        - type: object
          required: [content, steps, decisions]
          properties:
            content: { $ref: "#/components/schemas/ContentDetail" }
            steps:
              type: array
              items: { type: object }
            decisions:
              type: array
              items: { type: object }
    ApprovalPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApprovalRequest" }
        page: { $ref: "#/components/schemas/PageMeta" }
    CreateApprovalDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT, REQUEST_CHANGES]
        comment: { type: [string, "null"], maxLength: 2000 }
    PlaylistItemInput:
      type: object
      required: [contentItemId, contentVersionId, durationMs]
      additionalProperties: false
      properties:
        contentItemId: { $ref: "#/components/schemas/Uuid" }
        contentVersionId: { $ref: "#/components/schemas/Uuid" }
        durationMs: { type: integer, minimum: 1000, maximum: 86400000 }
        enabled: { type: boolean, default: true }
    WritePlaylist:
      type: object
      required: [name, items]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 1000 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/PlaylistItemInput" }
    Playlist:
      type: object
      required: [id, name, status, version, items]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string }
        version: { type: integer, minimum: 1 }
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PlaylistItemInput"
              - type: object
                required: [id, position]
                properties:
                  id: { $ref: "#/components/schemas/Uuid" }
                  position: { type: integer, minimum: 0 }
    PlaylistPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Playlist" }
        page: { $ref: "#/components/schemas/PageMeta" }
    ScheduleTargetInput:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [ORGANIZATION, CAMPUS, BUILDING, ZONE, DEVICE_GROUP, DEVICE]
        id: { type: [string, "null"], format: uuid }
    ScheduleRevisionInput:
      type: object
      required: [playlistId, kind, timezone, startsAt, priority, targets]
      additionalProperties: false
      properties:
        playlistId: { $ref: "#/components/schemas/Uuid" }
        kind: { type: string, enum: [ONE_TIME, RECURRING] }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        startsAt: { $ref: "#/components/schemas/Timestamp" }
        endsAt: { type: [string, "null"], format: date-time }
        recurrenceRule: { type: [string, "null"], maxLength: 1000 }
        priority: { type: integer, minimum: -1000, maximum: 1000 }
        emergency: { type: boolean, default: false }
        targets:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ScheduleTargetInput" }
    CreateSchedule:
      allOf:
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 160 }
        - $ref: "#/components/schemas/ScheduleRevisionInput"
    Schedule:
      type: object
      required: [id, name, status, currentRevision, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        status: { type: string }
        currentRevision: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
    ScheduleDetail:
      allOf:
        - $ref: "#/components/schemas/Schedule"
        - type: object
          required: [revisions]
          properties:
            revisions:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ScheduleRevisionInput"
                  - type: object
                    required: [id, revisionNumber]
                    properties:
                      id: { $ref: "#/components/schemas/Uuid" }
                      revisionNumber: { type: integer, minimum: 1 }
    SchedulePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Schedule" }
        page: { $ref: "#/components/schemas/PageMeta" }
    ScheduleOccurrence:
      type: object
      required: [id, scheduleId, startsAt, endsAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        scheduleId: { $ref: "#/components/schemas/Uuid" }
        startsAt: { $ref: "#/components/schemas/Timestamp" }
        endsAt: { $ref: "#/components/schemas/Timestamp" }
        effectiveTargets:
          type: array
          items: { $ref: "#/components/schemas/ScheduleTargetInput" }
    ConflictPreview:
      type: object
      required: [valid, conflicts, effectivePrecedence]
      properties:
        valid: { type: boolean }
        conflicts:
          type: array
          items:
            type: object
            required: [scheduleId, reason, resolution]
            properties:
              scheduleId: { $ref: "#/components/schemas/Uuid" }
              reason: { type: string }
              resolution: { type: string }
        effectivePrecedence: { type: string }
    Device:
      type: object
      required: [id, thingName, displayName, lifecycleStatus, connectivityStatus, version]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        thingName: { type: string }
        serialNumber: { type: [string, "null"] }
        displayName: { type: string }
        locationId: { type: [string, "null"], format: uuid }
        lifecycleStatus: { type: string }
        connectivityStatus: { type: string }
        lastSeenAt: { type: [string, "null"], format: date-time }
        appVersion: { type: [string, "null"] }
        activeManifestId: { type: [string, "null"], format: uuid }
        capabilities: { type: object }
        version: { type: integer, minimum: 1 }
    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          properties:
            runtimeState: { type: [object, "null"] }
            certificates:
              type: array
              items: { type: object }
            recentCommands:
              type: array
              items: { $ref: "#/components/schemas/DeviceCommand" }
            currentManifest:
              oneOf:
                - $ref: "#/components/schemas/Manifest"
                - type: "null"
    DevicePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }
        page: { $ref: "#/components/schemas/PageMeta" }
    RegisterDevice:
      type: object
      required: [thingName, displayName]
      additionalProperties: false
      properties:
        thingName:
          type: string
          pattern: "^[A-Za-z0-9:_-]{1,128}$"
        displayName: { type: string, minLength: 1, maxLength: 160 }
        serialNumber: { type: [string, "null"], maxLength: 120 }
        locationId: { type: [string, "null"], format: uuid }
        hardwareModel: { type: [string, "null"], maxLength: 120 }
        capabilities: { type: object }
    UpdateDevice:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 160 }
        locationId: { type: [string, "null"], format: uuid }
        lifecycleStatus:
          type: string
          enum: [ACTIVE, MAINTENANCE, QUARANTINED]
        desiredConfig: { type: object }
    ProvisioningClaim:
      type: object
      required: [claimId, claimToken, expiresAt]
      properties:
        claimId: { $ref: "#/components/schemas/Uuid" }
        claimToken:
          type: string
          description: Returned once and stored only as a hash by CampusCast.
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
    Heartbeat:
      type: object
      required: [occurredAt, receivedAt]
      properties:
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        receivedAt: { $ref: "#/components/schemas/Timestamp" }
        appVersion: { type: [string, "null"] }
        activeManifestVersion: { type: [integer, "null"] }
        playbackState: { type: [string, "null"] }
        freeStorageBytes: { type: [integer, "null"], minimum: 0 }
        networkType: { type: [string, "null"] }
    HeartbeatPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Heartbeat" }
        page: { $ref: "#/components/schemas/PageMeta" }
    DeviceLog:
      type: object
      required: [id, severity, eventType, message, occurredAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        severity: { type: string }
        eventType: { type: string }
        message: { type: string }
        context: { type: [object, "null"] }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
    DeviceLogPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceLog" }
        page: { $ref: "#/components/schemas/PageMeta" }
    MetricPoint:
      type: object
      required: [occurredAt, value]
      properties:
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
        value: { type: number }
        unit: { type: [string, "null"] }
    WriteDeviceGroup:
      type: object
      required: [name, deviceIds]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 1000 }
        deviceIds:
          type: array
          uniqueItems: true
          maxItems: 10000
          items: { $ref: "#/components/schemas/Uuid" }
    DeviceGroup:
      allOf:
        - $ref: "#/components/schemas/WriteDeviceGroup"
        - type: object
          required: [id, version]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            version: { type: integer, minimum: 1 }
    IssueDeviceCommand:
      type: object
      required: [type, expiresAt]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [REFRESH_MANIFEST, APPLY_CONFIG, CLEAR_CACHE, COLLECT_DIAGNOSTICS, RESTART_APP, REBOOT_DEVICE]
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        payload: { type: object, default: {} }
    DeviceCommand:
      type: object
      required: [id, deviceId, type, status, issuedAt, expiresAt, correlationId]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        deviceId: { $ref: "#/components/schemas/Uuid" }
        type: { type: string }
        status: { type: string }
        issuedAt: { $ref: "#/components/schemas/Timestamp" }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        correlationId: { type: string }
        result: { type: [object, "null"] }
    DeviceCommandDetail:
      allOf:
        - $ref: "#/components/schemas/DeviceCommand"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items: { type: object }
    CommandPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeviceCommand" }
        page: { $ref: "#/components/schemas/PageMeta" }
    Manifest:
      type: object
      required: [id, deviceId, manifestVersion, schemaVersion, status, sha256, validFrom]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        deviceId: { $ref: "#/components/schemas/Uuid" }
        manifestVersion: { type: integer, minimum: 1 }
        schemaVersion: { type: integer, minimum: 1 }
        status: { type: string }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        validFrom: { $ref: "#/components/schemas/Timestamp" }
        validUntil: { type: [string, "null"], format: date-time }
        deliveryStatus: { type: [string, "null"] }
    ManifestDetail:
      allOf:
        - $ref: "#/components/schemas/Manifest"
        - type: object
          required: [scheduleRevisionIds, deliveryEvents]
          properties:
            scheduleRevisionIds:
              type: array
              items: { $ref: "#/components/schemas/Uuid" }
            deliveryEvents:
              type: array
              items: { type: object }
    ManifestPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Manifest" }
        page: { $ref: "#/components/schemas/PageMeta" }
    CreateOtaArtifact:
      type: object
      required: [versionName, versionCode, objectKey, sha256, byteLength, signature]
      additionalProperties: false
      properties:
        versionName: { type: string, minLength: 1, maxLength: 80 }
        versionCode: { type: integer, minimum: 1 }
        objectKey: { type: string, minLength: 1, maxLength: 1024 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        byteLength: { type: integer, minimum: 1 }
        signature: { type: string, minLength: 1, maxLength: 8192 }
        minAndroidApi: { type: [integer, "null"], minimum: 1 }
        maxAndroidApi: { type: [integer, "null"], minimum: 1 }
        releaseNotes: { type: [string, "null"], maxLength: 10000 }
    OtaArtifact:
      allOf:
        - $ref: "#/components/schemas/CreateOtaArtifact"
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
            status: { type: string }
            createdAt: { $ref: "#/components/schemas/Timestamp" }
    CreateOtaCampaign:
      type: object
      required: [artifactId, name, rolloutConfig, abortConfig, targets]
      additionalProperties: false
      properties:
        artifactId: { $ref: "#/components/schemas/Uuid" }
        name: { type: string, minLength: 1, maxLength: 160 }
        rolloutConfig: { type: object }
        abortConfig: { type: object }
        scheduledAt: { type: [string, "null"], format: date-time }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              deviceGroupId: { type: [string, "null"], format: uuid }
              deviceId: { type: [string, "null"], format: uuid }
    OtaCampaign:
      type: object
      required: [id, artifactId, name, status, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        artifactId: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        status: { type: string }
        awsJobId: { type: [string, "null"] }
        scheduledAt: { type: [string, "null"], format: date-time }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    OtaCampaignDetail:
      allOf:
        - $ref: "#/components/schemas/OtaCampaign"
        - type: object
          required: [targets, executionSummary]
          properties:
            targets:
              type: array
              items: { type: object }
            executionSummary: { type: object, additionalProperties: { type: integer } }
    OtaCampaignPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OtaCampaign" }
        page: { $ref: "#/components/schemas/PageMeta" }
    AnalyticsOverview:
      type: object
      required: [from, to, fleet, playback, delivery]
      properties:
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        fleet: { type: object, additionalProperties: { type: number } }
        playback: { type: object, additionalProperties: { type: number } }
        delivery: { type: object, additionalProperties: { type: number } }
        series:
          type: array
          items: { type: object }
    ContentAnalytics:
      type: object
      required: [contentId, playStarts, completions, failures]
      properties:
        contentId: { $ref: "#/components/schemas/Uuid" }
        playStarts: { type: integer, minimum: 0 }
        completions: { type: integer, minimum: 0 }
        failures: { type: integer, minimum: 0 }
        byDevice:
          type: array
          items: { type: object }
    DeviceAnalytics:
      type: object
      required: [deviceId, playbackAvailability, offlineDurationSeconds]
      properties:
        deviceId: { $ref: "#/components/schemas/Uuid" }
        playbackAvailability: { type: number, minimum: 0, maximum: 1 }
        offlineDurationSeconds: { type: integer, minimum: 0 }
        playFailures: { type: integer, minimum: 0 }
        series:
          type: array
          items: { type: object }
    CreateAnalyticsExport:
      type: object
      required: [report, from, to]
      additionalProperties: false
      properties:
        report: { type: string, enum: [FLEET, PLAYBACK, CONTENT, DEVICES, PILOT_KPI] }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        filters: { type: object }
    Notification:
      type: object
      required: [id, type, severity, status, title, body, createdAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        type: { type: string }
        severity: { type: string }
        status: { type: string }
        title: { type: string }
        body: { type: string }
        resourceType: { type: [string, "null"] }
        resourceId: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
    NotificationPage:
      type: object
      required: [items, page, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        page: { $ref: "#/components/schemas/PageMeta" }
        unreadCount: { type: integer, minimum: 0 }
    NotificationPreferenceInput:
      type: object
      required: [type, channel, enabled, minimumSeverity]
      additionalProperties: false
      properties:
        type: { type: string }
        channel: { type: string, enum: [IN_APP, EMAIL, WHATSAPP] }
        enabled: { type: boolean }
        minimumSeverity: { type: string, enum: [INFO, WARNING, ERROR, CRITICAL] }
    NotificationPreference:
      allOf:
        - $ref: "#/components/schemas/NotificationPreferenceInput"
        - type: object
          required: [id]
          properties:
            id: { $ref: "#/components/schemas/Uuid" }
    AuditLog:
      type: object
      required: [id, actorType, action, resourceType, outcome, correlationId, occurredAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        actorUserId: { type: [string, "null"], format: uuid }
        actorType: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: [string, "null"] }
        outcome: { type: string }
        correlationId: { type: string }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        metadata: { type: [object, "null"] }
        occurredAt: { $ref: "#/components/schemas/Timestamp" }
    AuditPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditLog" }
        page: { $ref: "#/components/schemas/PageMeta" }
