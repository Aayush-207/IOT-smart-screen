openapi: 3.1.0
info:
  title: CampusCast Core API
  version: 1.0.0
  description: >
    Versioned REST contract for the CampusCast dashboard and authorized
    operational clients. Device MQTT contracts are defined separately.
  license:
    name: Proprietary - CampusCast
    identifier: LicenseRef-CampusCast-Proprietary
servers:
  - url: https://api.campuscast.example/api
    description: Production placeholder
  - url: https://staging-api.campuscast.example/api
    description: Staging placeholder
security:
  - cognitoJwt: []
tags:
  - name: Health
    description: Process and dependency health endpoints.
  - name: Identity
    description: Current-user profile, session, and logout operations.
  - name: Organization
    description: Active-tenant settings.
  - name: Locations
    description: Campus, building, zone, and installation-location hierarchy.
  - name: Users
    description: Tenant membership and invitation administration.
  - name: Roles
    description: Scoped role and permission administration.
  - name: Categories
    description: Content classification.
  - name: Content
    description: Content lifecycle and immutable versions.
  - name: Uploads
    description: Secure direct-upload and validation workflow.
  - name: Approvals
    description: Review queue and immutable decisions.
  - name: Playlists
    description: Ordered approved-content programming.
  - name: Schedules
    description: Versioned schedules, conflicts, and calendar occurrences.
  - name: Devices
    description: Fleet inventory, provisioning, health, logs, and metrics.
  - name: Device Groups
    description: Logical scheduling and rollout cohorts.
  - name: Device Commands
    description: Expiring idempotent remote commands.
  - name: Manifests
    description: Compiled playback manifests and delivery history.
  - name: OTA
    description: Signed artifacts and staged AWS IoT Jobs rollouts.
  - name: Analytics
    description: Fleet, content, device, and pilot KPI aggregates.
  - name: Notifications
    description: In-app inbox and delivery preferences.
  - name: Audit
    description: Read-only append-only audit records.
  - name: Operations
    description: Status for accepted asynchronous control-plane work.
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Process liveness
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Dependency readiness
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Get the current user and active organization membership
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Identity]
      operationId: updateCurrentUser
      summary: Update permitted profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfile"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      summary: Revoke the current application session
      responses:
        "204":
          description: Session revoked

  /v1/me/sessions:
    get:
      tags: [Identity]
      operationId: listCurrentUserSessions
      summary: List active application sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /v1/me/sessions/{sessionId}:
    delete:
      tags: [Identity]
      operationId: revokeCurrentUserSession
      summary: Revoke one owned session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Session revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/organization:
    get:
      tags: [Organization]
      operationId: getActiveOrganization
      summary: Get the active organization
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    patch:
      tags: [Organization]
      operationId: updateActiveOrganization
      summary: Update organization settings
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganization"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/campuses:
    get:
      tags: [Locations]
      operationId: listCampuses
      summary: List campuses
      responses:
        "200":
          description: Campuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campus"
    post:
      tags: [Locations]
      operationId: createCampus
      summary: Create a campus
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteCampus"
      responses:
        "201":
          description: Campus created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campus"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/campuses/{campusId}:
    get:
      tags: [Locations]
      operationId: getCampus
      summary: Get a campus
      parameters:
        - $ref: "#/components/parameters/CampusId"
      responses:
        "200":
          description: Campus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campus"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Locations]
      operationId: updateCampus
      summary: Update a campus
      parameters:
        - $ref: "#/components/parameters/CampusId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteCampus"
      responses:
        "200":
          description: Campus updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campus"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Locations]
      operationId: archiveCampus
      summary: Archive a campus that has no active dependants
      parameters:
        - $ref: "#/components/parameters/CampusId"
      responses:
        "204":
          description: Campus archived
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/campuses/{campusId}/buildings:
    get:
      tags: [Locations]
      operationId: listBuildings
      summary: List buildings in a campus
      parameters:
        - $ref: "#/components/parameters/CampusId"
      responses:
        "200":
          description: Buildings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
    post:
      tags: [Locations]
      operationId: createBuilding
      summary: Create a building
      parameters:
        - $ref: "#/components/parameters/CampusId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteNamedLocation"
      responses:
        "201":
          description: Building created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"

  /v1/buildings/{buildingId}:
    get:
      tags: [Locations]
      operationId: getBuilding
      summary: Get a building
      parameters:
        - $ref: "#/components/parameters/BuildingId"
      responses:
        "200":
          description: Building
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Locations]
      operationId: updateBuilding
      summary: Update a building
      parameters:
        - $ref: "#/components/parameters/BuildingId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteNamedLocation"
      responses:
        "200":
          description: Building updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
    delete:
      tags: [Locations]
      operationId: archiveBuilding
      summary: Archive a building
      parameters:
        - $ref: "#/components/parameters/BuildingId"
      responses:
        "204":
          description: Building archived
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/buildings/{buildingId}/zones:
    get:
      tags: [Locations]
      operationId: listZones
      summary: List zones in a building
      parameters:
        - $ref: "#/components/parameters/BuildingId"
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
    post:
      tags: [Locations]
      operationId: createZone
      summary: Create a zone
      parameters:
        - $ref: "#/components/parameters/BuildingId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteZone"
      responses:
        "201":
          description: Zone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"

  /v1/zones/{zoneId}:
    get:
      tags: [Locations]
      operationId: getZone
      summary: Get a zone
      parameters:
        - $ref: "#/components/parameters/ZoneId"
      responses:
        "200":
          description: Zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
    patch:
      tags: [Locations]
      operationId: updateZone
      summary: Update a zone
      parameters:
        - $ref: "#/components/parameters/ZoneId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteZone"
      responses:
        "200":
          description: Zone updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
    delete:
      tags: [Locations]
      operationId: archiveZone
      summary: Archive a zone
      parameters:
        - $ref: "#/components/parameters/ZoneId"
      responses:
        "204":
          description: Zone archived
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/zones/{zoneId}/locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: List installation locations
      parameters:
        - $ref: "#/components/parameters/ZoneId"
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      tags: [Locations]
      operationId: createLocation
      summary: Create an installation location
      parameters:
        - $ref: "#/components/parameters/ZoneId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteLocation"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /v1/locations/{locationId}:
    get:
      tags: [Locations]
      operationId: getLocation
      summary: Get an installation location
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    patch:
      tags: [Locations]
      operationId: updateLocation
      summary: Update an installation location
      parameters:
        - $ref: "#/components/parameters/LocationId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteLocation"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      tags: [Locations]
      operationId: archiveLocation
      summary: Archive an installation location
      parameters:
        - $ref: "#/components/parameters/LocationId"
      responses:
        "204":
          description: Location archived
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List organization users
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [INVITED, ACTIVE, SUSPENDED, REVOKED]
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"

  /v1/users/invitations:
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Invite a user to the active organization
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUser"
      responses:
        "202":
          description: Invitation accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/users/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get an organization user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUser"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      operationId: updateUserMembership
      summary: Activate, suspend, or revoke organization membership
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMembership"
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUser"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/users/{userId}/role-assignments:
    post:
      tags: [Users, Roles]
      operationId: assignUserRole
      summary: Assign a scoped role
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRole"
      responses:
        "201":
          description: Role assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/users/{userId}/role-assignments/{assignmentId}:
    delete:
      tags: [Users, Roles]
      operationId: revokeUserRole
      summary: Revoke a scoped role assignment
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "204":
          description: Assignment revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List organization roles and permissions
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create a custom role
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteRole"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /v1/roles/{roleId}:
    patch:
      tags: [Roles]
      operationId: updateRole
      summary: Update a custom role
      parameters:
        - $ref: "#/components/parameters/RoleId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteRole"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Roles]
      operationId: archiveRole
      summary: Archive an unused custom role
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "204":
          description: Role archived
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List content categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a content category
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteCategory"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /v1/categories/{categoryId}:
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Update a content category
      parameters:
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteCategory"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      tags: [Categories]
      operationId: archiveCategory
      summary: Archive a category
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Category archived

  /v1/content:
    get:
      tags: [Content]
      operationId: listContent
      summary: Search and filter the content library
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: ownerUnitId
          in: query
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: Content page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPage"
    post:
      tags: [Content]
      operationId: createContent
      summary: Create a draft content item and first version
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContent"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/content/{contentId}:
    get:
      tags: [Content]
      operationId: getContent
      summary: Get content, versions, validation, and approval summary
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Content]
      operationId: updateContentDraft
      summary: Update draft metadata and create a revision when required
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContent"
      responses:
        "200":
          description: Content updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDetail"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Content]
      operationId: archiveContent
      summary: Archive content that is not active
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204":
          description: Content archived
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/content/{contentId}/versions:
    post:
      tags: [Content]
      operationId: createContentVersion
      summary: Create a new content version for replacement media or controlled metadata
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentVersion"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVersion"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/content/{contentId}/submit:
    post:
      tags: [Content, Approvals]
      operationId: submitContentForApproval
      summary: Freeze the current version and submit it for approval
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "202":
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/content/{contentId}/retire:
    post:
      tags: [Content]
      operationId: retireContent
      summary: Prevent future scheduling and trigger manifest reconciliation
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Retirement accepted
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: Create a bounded direct-to-S3 quarantine upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpload"
      responses:
        "201":
          description: Upload authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAuthorization"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /v1/uploads/{uploadId}:
    get:
      tags: [Uploads]
      operationId: getUpload
      summary: Get upload and validation status
      parameters:
        - $ref: "#/components/parameters/UploadId"
      responses:
        "200":
          description: Upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/uploads/{uploadId}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
